<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">

<title>student registration form</title>
<style>
    form {
        background-color: rgb(114, 207, 238);
        padding: 20px;
        border-radius: 5px;
        width: 400px;
        margin: auto;
        align-items: center;
        border: 2px solid black;}

    label {
        display: inline-block;
        width: 80px;
        row-gap: 50px;
        column-gap: 50px;
        text-align: right;
        margin-right: 10px;
        size: 14px;
    }
    
</style></head><body>&gt;


   
    <form>
        <h1>Student Registration Form</h1>
        <label for="roll no">Roll No:</label>
        <input type="text" id="roll no" name="roll no">
        <br>
        <label for=" student name">Name:</label>
        <input type="text" id=" student name" name=" student name">
        <br>
        <label for="father name">Father's Name:</label>
        <input type="text" id="father name" name="father name">
        <br>
        <label for="date of birth">Date of Birth:</label>
        <input type="date" id="date of birth" name="date of birth">
        <br>
        <label for="email id">     Email:</label>
        <input type="email" id="email id" name="email id">
        <br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br>
        <label for="department">Department:</label>
        <input type="checkbox" id="dep" name="cse">
        <label for="cse">CSE</label>
        <input type="checkbox" id="dep" name="it">
        <label for="it">IT</label>
        <input type="checkbox" id="dep" name="ece">
        <label for="ece">ECE</label>
        <input type="checkbox" id="dep" name="civil">
        <label for="civil">Civil</label>
        <input type="checkbox" id="dep" name="mech">
        <label for="mech">Mechanical</label>
       <br>
        <label for="course">Course:</label>
        
        <select id="course" name="course">
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
        </select>
        <br>
        <label for="photo">Student Photo:</label>
        <input type="file" id="photo" name="photo">
        <br>
        <label for="city">City:</label>
        <input type="text" id="city" name="city">
        <br>
        <label for="address">State:</label>
        <input type="text" id="address" name="address">
        <br>
        <input type="submit" value="Submit">
        <br>
    </form>

</body></html>
